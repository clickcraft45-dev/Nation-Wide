<svg width="1200" height="1000" viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placeholder illustration of global logistics">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2A4A"/>
      <stop offset="100%" stop-color="#12365C"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1E88E5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1E88E5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1000" fill="url(#heroBg)"/>
  <rect width="1200" height="1000" fill="url(#heroGlow)"/>

  <!-- globe meridians -->
  <g stroke="#4AA3EC" stroke-opacity="0.28" fill="none" stroke-width="2">
    <circle cx="620" cy="470" r="300"/>
    <circle cx="620" cy="470" r="230"/>
    <ellipse cx="620" cy="470" rx="300" ry="120"/>
    <ellipse cx="620" cy="470" rx="120" ry="300"/>
  </g>

  <!-- route lines: air / ocean / road converging -->
  <g fill="none" stroke-linecap="round">
    <path d="M180 260 C 360 200, 520 260, 640 380" stroke="#7FC2F5" stroke-opacity="0.7" stroke-width="3" stroke-dasharray="2 14"/>
    <path d="M160 760 C 340 700, 520 640, 660 500" stroke="#7FC2F5" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="2 14"/>
    <path d="M760 820 C 780 700, 720 600, 660 500" stroke="#7FC2F5" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="2 14"/>
  </g>

  <!-- aircraft mark -->
  <g transform="translate(160,230)">
    <circle r="34" fill="#0F3A63" stroke="#4AA3EC" stroke-width="1.5"/>
    <path d="M-15 4 L15 4 M0 -12 L0 12 M-9 8 L9 8" stroke="#DCEEFC" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ocean freight mark -->
  <g transform="translate(150,760)">
    <circle r="34" fill="#0F3A63" stroke="#4AA3EC" stroke-width="1.5"/>
    <path d="M-16 6 L16 6 L11 16 L-11 16 Z M-9 6 L-9 -6 L9 -6 L9 6" stroke="#DCEEFC" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
  </g>

  <!-- road freight mark -->
  <g transform="translate(775,840)">
    <circle r="34" fill="#0F3A63" stroke="#4AA3EC" stroke-width="1.5"/>
    <path d="M-16 8 L10 8 L10 -6 L2 -6 L2 8 M10 -2 L18 -2 L18 8 L10 8" stroke="#DCEEFC" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
    <circle cx="-8" cy="12" r="2.4" fill="#DCEEFC"/>
    <circle cx="12" cy="12" r="2.4" fill="#DCEEFC"/>
  </g>

  <!-- central parcel -->
  <g transform="translate(640,500)">
    <rect x="-46" y="-46" width="92" height="92" rx="16" fill="#1261A0" stroke="#7FC2F5" stroke-width="2"/>
    <path d="M-46 -18 L0 -46 L46 -18 M0 -46 L0 46 M-46 -18 L-46 30 L0 46 L46 30 L46 -18" fill="none" stroke="#EAF4FC" stroke-width="2.4" stroke-linejoin="round"/>
  </g>

  <g opacity="0.6">
    <circle cx="900" cy="200" r="4" fill="#7FC2F5"/>
    <circle cx="960" cy="330" r="3" fill="#7FC2F5"/>
    <circle cx="330" cy="140" r="3" fill="#7FC2F5"/>
  </g>
</svg>
