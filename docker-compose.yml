# Production runs the backend and Redis here; PostgreSQL is installed directly on the EC2 host and
# is NOT duplicated as a container. The backend reaches it over the host loopback — see the
# extra_hosts entry below.
#
# There is no database container and no mongo service: MongoDB was only ever the testing database
# and is gone from the architecture entirely.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Loopback only. Redis has no password here, so not listening on a public interface is the
      # control that keeps it private — the EC2 security group must not open 6379 either.
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # Loopback only: Nginx/Caddy on the host terminates TLS and proxies to this port. The Node
      # process is never exposed to the internet directly, and 4000 stays closed in the security
      # group.
      - "127.0.0.1:4000:4000"
    # host.docker.internal resolves to the EC2 host itself, which is where PostgreSQL runs. This
    # is what lets DATABASE_URL point at the host's Postgres without publishing 5432 anywhere.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Reads the same file the natively-run backend reads instead of re-listing every variable
    # here. That hand-maintained copy is what silently drifted (it still said Postgres long after
    # the app moved to MongoDB); one source of truth can't drift from itself. Copy
    # backend/.env.example to backend/.env first — compose fails fast if it's missing.
    env_file:
      - backend/.env
    # Only the values that must differ inside the compose network. These win over env_file.
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 4000

volumes:
  redis_data:
