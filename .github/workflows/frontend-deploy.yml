name: Deploy frontend to Cloudflare Workers

# Production deploys only. Pushes to `frontend` are the promote step (see docs/DEPLOYMENT.md);
# there is deliberately no `pull_request` trigger, so a PR can never reach production.
# workflow_dispatch is operator-initiated, not automatic — it exists so a rollback can be run
# from the Actions tab without pushing a commit.
on:
  push:
    branches: [frontend]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. cancel-in-progress is false on purpose: cancelling a half-finished
# `wrangler deploy` is how you get a Worker serving a partially-uploaded bundle.
concurrency:
  group: frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      # Public, not secret: NEXT_PUBLIC_* values are inlined into the client bundle at build time
      # and are readable by anyone loading the site. They live here (overridable by repository
      # variables) rather than in secrets, which would imply a confidentiality they do not have.
      # Changing one requires a rebuild — a redeploy alone will not pick it up.
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://api.nationwidelogistics.co/api/v1' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.nationwidelogistics.co' }}
      # Without this the admin company-logo <img> is blocked by the frontend's own img-src CSP
      # (see frontend/next.config.ts) — silently, with no console error on the server side.
      NEXT_PUBLIC_S3_ORIGIN: ${{ vars.NEXT_PUBLIC_S3_ORIGIN || 'https://nationwide-logistics-s3.s3.ap-south-1.amazonaws.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      # From the REPO ROOT, not frontend/. This is an npm workspaces monorepo and the only
      # package-lock.json is at the root; `npm ci` inside frontend/ exits immediately because it
      # finds no lockfile. It also installs @nationwide/shared-types, which frontend depends on
      # and which is not published to any registry.
      - name: Install dependencies
        run: npm ci

      # frontend imports @nationwide/shared-types from its dist/, which is gitignored and only
      # exists once tsc has run. `next build` fails to resolve the package without this.
      - name: Build shared-types
        run: npm run build --workspace=packages/shared-types

      # The existing script, unchanged: next build + the OpenNext Worker bundle into
      # frontend/.open-next/. A non-zero exit here fails the job and nothing is deployed.
      - name: Build frontend for Cloudflare
        working-directory: frontend
        run: npm run build:cf

      # The same command that works manually, using the repo's pinned wrangler and the existing
      # frontend/wrangler.jsonc. Output is not piped or suppressed, so a deploy failure surfaces
      # verbatim in the job log and fails the run.
      - name: Deploy to Cloudflare Workers
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
