name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # Throwaway local Mongo, never Atlas: CI must not need a network allowlist entry, and a
      # run that seeds and mutates data must not point at a shared cluster.
      DATABASE_URL: "mongodb://localhost:27017/nationwide?replicaSet=rs0"
      REDIS_URL: "redis://localhost:6379"
      JWT_ACCESS_SECRET: "ci-only-access-secret-not-for-prod"
      JWT_REFRESH_SECRET: "ci-only-refresh-secret-not-for-prod"
      JWT_ACCESS_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN: "7d"
      PORT: 4000
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: "ci-only-whatsapp-verify-token"
      WHATSAPP_APP_SECRET: "ci-only-whatsapp-app-secret"

    steps:
      # Pinned to a commit SHA rather than the floating `v4` tag (INFRA-4) — these actions run
      # with repo/secrets access, and a tag can be silently repointed by a compromised upstream
      # without any change on this repo's side. Bump deliberately by re-resolving the tag's
      # current SHA, not by editing the SHA by hand.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      # Not a service container: Prisma's mongodb connector needs a replica set for transactions,
      # and service containers can't override the image's command to pass --replSet. The set is
      # initiated with host localhost:27017 so the address the driver discovers is the same one
      # the runner can reach.
      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          until docker exec mongo mongosh --quiet --eval 'db.adminCommand("ping").ok' >/dev/null 2>&1; do sleep 1; done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          until docker exec mongo mongosh --quiet --eval 'rs.status().myState === 1 || quit(1)' >/dev/null 2>&1; do sleep 1; done

      - name: Install dependencies
        run: npm ci

      - name: Build shared-types
        run: npm run build --workspace=packages/shared-types

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/backend/prisma/schema.prisma

      # db push, not migrate deploy: the mongodb connector has no migration history — the schema
      # is applied by creating collections and indexes directly.
      - name: Sync database schema
        run: npx prisma db push --schema=apps/backend/prisma/schema.prisma

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Unit tests
        run: npm run test --workspaces --if-present

      - name: E2E tests (backend, against mocked ICL adapter once integrated)
        run: npm run test:e2e --workspace=apps/backend

      - name: Build
        run: npm run build --workspace=apps/backend && npm run build --workspace=apps/frontend

      - name: Seed database
        run: npm run db:seed --workspace=apps/backend

      - name: Production runtime smoke test
        working-directory: apps/backend
        run: |
          node dist/src/main.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4000/api/v1 > /dev/null; then
              echo "Backend responded successfully"
              curl -sf http://localhost:4000/api/v1/tracking/NW-DEMOTRACK1 | grep -q internalTrackingNumber
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not respond in time"
          kill $SERVER_PID
          exit 1

      - name: Security scan (npm audit)
        run: npm audit --audit-level=high
