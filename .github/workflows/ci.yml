name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nationwide
          POSTGRES_PASSWORD: nationwide_ci
          POSTGRES_DB: nationwide
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nationwide"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://nationwide:nationwide_ci@localhost:5432/nationwide?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_ACCESS_SECRET: "ci-only-access-secret-not-for-prod"
      JWT_REFRESH_SECRET: "ci-only-refresh-secret-not-for-prod"
      JWT_ACCESS_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN: "7d"
      PORT: 4000
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: "ci-only-whatsapp-verify-token"
      WHATSAPP_APP_SECRET: "ci-only-whatsapp-app-secret"

    steps:
      # Pinned to a commit SHA rather than the floating `v4` tag (INFRA-4) — these actions run
      # with repo/secrets access, and a tag can be silently repointed by a compromised upstream
      # without any change on this repo's side. Bump deliberately by re-resolving the tag's
      # current SHA, not by editing the SHA by hand.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared-types
        run: npm run build --workspace=packages/shared-types

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/backend/prisma/schema.prisma

      - name: Run database migrations
        run: npx prisma migrate deploy --schema=apps/backend/prisma/schema.prisma

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Unit tests
        run: npm run test --workspaces --if-present

      - name: E2E tests (backend, against mocked ICL adapter once integrated)
        run: npm run test:e2e --workspace=apps/backend

      - name: Build
        run: npm run build --workspace=apps/backend && npm run build --workspace=apps/frontend

      - name: Seed database
        run: npm run db:seed --workspace=apps/backend

      - name: Production runtime smoke test
        working-directory: apps/backend
        run: |
          node dist/src/main.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4000/api/v1 > /dev/null; then
              echo "Backend responded successfully"
              curl -sf http://localhost:4000/api/v1/tracking/NW-DEMOTRACK1 | grep -q internalTrackingNumber
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not respond in time"
          kill $SERVER_PID
          exit 1

      - name: Security scan (npm audit)
        run: npm audit --audit-level=high
