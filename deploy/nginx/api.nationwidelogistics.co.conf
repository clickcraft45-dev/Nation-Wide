# Nginx on the EC2 host: the only public entry point to the API (see docs/DEPLOYMENT.md).
# The backend container listens on 127.0.0.1:4000 only; Postgres and Redis are not reachable
# from outside at all. Install:
#
#   sudo certbot --nginx -d api.nationwidelogistics.co      # once, creates the certificate files
#   sudo cp deploy/nginx/api.nationwidelogistics.co.conf /etc/nginx/conf.d/nationwide.conf
#   sudo nginx -t && sudo systemctl reload nginx

upstream nationwide_api {
    server 127.0.0.1:4000;
    # Reused connections to Node instead of a new TCP handshake per request.
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.nationwidelogistics.co;
    # certbot --nginx answers its renewal challenge by editing this block in place while it runs.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.nationwidelogistics.co;

    ssl_certificate     /etc/letsencrypt/live/api.nationwidelogistics.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nationwidelogistics.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Nginx's default is 1 MB, which rejects with 413 before the request reaches the app: parcel
    # photos and expense receipts are allowed 10 MB, rate-sheet workbooks 25 MB.
    client_max_body_size 26m;

    # Only the API is served from this host. Anything else is a scanner.
    location / { return 404; }

    location /api/ {
        proxy_pass http://nationwide_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # main.ts trusts loopback as a proxy and reads the client's address from this, which is
        # what the per-IP rate limits key on.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # Rate-sheet imports and PDF generation can run for a minute or more.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        gzip on;
        gzip_types application/json text/plain text/csv;
        gzip_min_length 1024;
    }
}
